plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ssh'
version = '1.0.0'

android {
  namespace "expo.modules.ssh"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JSch — battle-tested Java SSH2 implementation, works on Android
  implementation 'com.jcraft:jsch:0.1.55'
}
