plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ssh'
version = '1.0.0'

android {
  namespace "expo.modules.ssh"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // mwiede/jsch — maintained JSch fork, same com.jcraft.jsch package,
  // adds OpenSSH private key format support (ed25519, ECDSA, RSA new-format)
  implementation 'com.github.mwiede:jsch:0.2.19'
}
